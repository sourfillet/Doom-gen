[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-gen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "shapely>=2.1,<3",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
ml = [
    "torch>=2.2",
]
engine = [
    "vizdoom==1.3.1",
]

[project.scripts]
parse-wad = "cli.parse_wad:main"
tag-maps = "cli.tag_maps:main"
train-layout = "cli.train_layout:main"
generate-wad = "cli.generate_wad:main"
train-properties = "cli.train_properties:main"
train-placement = "cli.train_placement:main"
train-roomgen = "cli.train_roomgen:main"
generate-roomgen = "cli.generate_roomgen:main"
prepare-corpus = "cli.prepare_corpus:main"
diagnose-maps = "cli.diagnose_maps:main"
overfit-roomgen = "cli.overfit_roomgen:main"
evaluate-roomgen = "cli.evaluate_roomgen:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wad_parser*", "cli*", "tagging*", "data*", "models*", "generation*", "wad_writer*", "roomgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
