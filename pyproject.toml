[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-gen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
parse-wad = "cli.parse_wad:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wad_parser*", "cli*"]
