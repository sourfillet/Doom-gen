[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-gen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
ml = [
    "torch>=2.2",
]

[project.scripts]
parse-wad = "cli.parse_wad:main"
tag-maps = "cli.tag_maps:main"
train-layout = "cli.train_layout:main"
generate-wad = "cli.generate_wad:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wad_parser*", "cli*", "tagging*", "data*", "models*", "generation*", "wad_writer*"]
